<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
	<title>$GODOT_PROJECT_NAME - 3D Client</title>
	<style>
		:root {
			--bg-color: #1a1816;
			--panel-bg: rgba(36, 32, 29, 0.90);
			--panel-border: #4a3b32;
			--text-main: #f5ede0;
			--text-muted: #a69888;
			--gold-accent: #f5b041;
			--gold-glow: rgba(245, 176, 65, 0.4);
		}

		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		html, body {
			width: 100%;
			height: 100%;
			overflow: hidden;
			background-color: var(--bg-color);
			color: var(--text-main);
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			touch-action: none;
		}

		#canvas {
			display: block;
			width: 100vw;
			height: 100vh;
			position: absolute;
			top: 0;
			left: 0;
			outline: none;
		}

		#canvas:focus {
			outline: none;
		}

		/* Top Navigation Overlay Banner */
		.top-banner {
			position: fixed;
			top: 0;
			left: 0;
			right: 0;
			z-index: 100;
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 10px 18px;
			background: var(--panel-bg);
			backdrop-filter: blur(10px);
			-webkit-backdrop-filter: blur(10px);
			border-bottom: 1px solid var(--panel-border);
			box-shadow: 0 4px 20px rgba(0, 0, 0, 0.45);
			user-select: none;
		}

		.banner-left {
			display: flex;
			align-items: center;
		}

		.banner-link {
			display: inline-flex;
			align-items: center;
			gap: 8px;
			color: var(--gold-accent);
			text-decoration: none;
			font-size: 13px;
			font-weight: 600;
			padding: 6px 14px;
			background: rgba(245, 176, 65, 0.12);
			border: 1px solid rgba(245, 176, 65, 0.35);
			border-radius: 6px;
			transition: all 0.2s ease;
		}

		.banner-link:hover {
			background: rgba(245, 176, 65, 0.22);
			border-color: rgba(245, 176, 65, 0.7);
			color: #ffd580;
			box-shadow: 0 0 10px var(--gold-glow);
			transform: translateY(-1px);
		}

		.banner-center {
			display: flex;
			align-items: center;
			gap: 8px;
		}

		.banner-title {
			font-size: 15px;
			font-weight: 700;
			letter-spacing: 0.5px;
			color: var(--text-main);
		}

		.banner-subtitle {
			font-size: 12px;
			color: var(--gold-accent);
			text-transform: uppercase;
			letter-spacing: 1px;
			padding: 2px 6px;
			background: rgba(245, 176, 65, 0.1);
			border-radius: 4px;
		}

		.banner-right {
			display: flex;
			align-items: center;
		}

		.status-badge {
			display: inline-flex;
			align-items: center;
			gap: 6px;
			font-size: 12px;
			color: var(--text-muted);
			background: rgba(0, 0, 0, 0.25);
			border: 1px solid var(--panel-border);
			padding: 4px 10px;
			border-radius: 12px;
		}

		.status-dot {
			width: 8px;
			height: 8px;
			border-radius: 50%;
			background-color: #2ecc71;
			box-shadow: 0 0 6px rgba(46, 204, 113, 0.7);
		}

		/* Godot Splash & Loading Screen */
		#status {
			position: absolute;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			background: radial-gradient(circle at 50% 30%, #2a241f 0%, #151311 100%);
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			z-index: 50;
			transition: opacity 0.3s ease;
		}

		#status-splash {
			max-height: 128px;
			max-width: 128px;
			margin-bottom: 24px;
			filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.5));
		}

		#status-splash.show-image--false {
			display: none;
		}

		#status-progress {
			width: 260px;
			height: 6px;
			appearance: none;
			border-radius: 3px;
			overflow: hidden;
			background: rgba(255, 255, 255, 0.1);
			border: 1px solid var(--panel-border);
		}

		#status-progress::-webkit-progress-bar {
			background: rgba(255, 255, 255, 0.1);
		}

		#status-progress::-webkit-progress-value {
			background: linear-gradient(90deg, #f5b041, #e53935);
		}

		#status-progress::-moz-progress-bar {
			background: linear-gradient(90deg, #f5b041, #e53935);
		}

		#status-label {
			margin-top: 12px;
			font-size: 13px;
			color: var(--text-muted);
			letter-spacing: 0.5px;
		}

		#status-notice {
			display: none;
			background-color: rgba(91, 57, 67, 0.95);
			border-radius: 8px;
			border: 1px solid #9b3943;
			color: #f5ede0;
			line-height: 1.4;
			margin: 1rem 2rem;
			padding: 1.25rem 1.5rem;
			text-align: center;
			max-width: 520px;
			z-index: 60;
		}

		@media (max-width: 600px) {
			.banner-subtitle {
				display: none;
			}
			.banner-title {
				font-size: 14px;
			}
			.top-banner {
				padding: 8px 12px;
			}
			.banner-link {
				padding: 5px 10px;
				font-size: 12px;
			}
		}
	</style>
	$GODOT_HEAD_INCLUDE
</head>
<body>
	<!-- Top overlay navigation banner -->
	<header class="top-banner">
		<div class="banner-left">
			<a href="/" class="banner-link" title="Return to 2D Checkers Client">
				<span>←</span> Switch to 2D Client
			</a>
		</div>
		<div class="banner-center">
			<span class="banner-title">$GODOT_PROJECT_NAME</span>
			<span class="banner-subtitle">3D Edition</span>
		</div>
		<div class="banner-right">
			<span class="status-badge">
				<span class="status-dot"></span>
				<span id="engine-status">3D Ready</span>
			</span>
		</div>
	</header>

	<canvas id="canvas">
		Your browser does not support the canvas tag.
	</canvas>

	<noscript>
		Your browser does not support JavaScript.
	</noscript>

	<div id="status">
		<img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="Checkers 3D">
		<progress id="status-progress"></progress>
		<div id="status-label">Loading 3D Engine...</div>
		<div id="status-notice"></div>
	</div>

	<!-- Cache-Busting & Asset Interception -->
	<script>
		const BUILD_VERSION = "BUILD_HASH_PLACEHOLDER";
		window.__BUILD_VERSION__ = (BUILD_VERSION !== "BUILD_HASH_PLACEHOLDER") ? BUILD_VERSION : Date.now().toString(36);
		const _nativeFetch = window.fetch;
		window.fetch = function(resource, init) {
			if (typeof resource === 'string' && (resource.endsWith('.wasm') || resource.endsWith('.pck') || resource.includes('.worklet.js'))) {
				const sep = resource.includes('?') ? '&' : '?';
				resource = `${resource}${sep}v=${window.__BUILD_VERSION__}`;
			}
			return _nativeFetch.call(this, resource, init);
		};

		// Pre-initialize window.GodotCheckersBridge so Godot can connect immediately on boot
		window.GodotCheckersBridge = window.GodotCheckersBridge || {};
	</script>

	<!-- Godot Engine Loader & Boot Script -->
	<script src="$GODOT_URL"></script>
	<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusLabel = document.getElementById('status-label');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.style.opacity = '0';
			setTimeout(() => statusOverlay.remove(), 300);
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		if (statusLabel) statusLabel.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error('[Godot 3D Engine Error]', err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred while initializing the 3D client.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => setTimeout(() => resolve(), 2000)),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			const missingMsg = 'Error:\nThe following features required to run Godot 3D on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
					const percent = Math.round((current / total) * 100);
					if (statusLabel) statusLabel.textContent = `Loading 3D Engine (${percent}%)...`;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
					if (statusLabel) statusLabel.textContent = 'Loading 3D Engine...';
				}
			},
		}).then(() => {
			setStatusMode('hidden');
			console.log('[Godot 3D] Engine initialized and running.');
		}, displayFailureNotice);
	}
}());
	</script>

	<!-- ES Module Integration Bridge -->
	<script type="module">
		import { CheckersController } from '../src/controller.js';
		import { GodotAdapter } from '../src/godot_adapter.js';

		const adapter = new GodotAdapter();
		const controller = new CheckersController(adapter);
		adapter.setController(controller);

		window.GodotCheckersBridge.onGodotReady = () => {
			console.log('[Godot 3D Shell] Godot reported onGodotReady. Initializing CheckersController...');
			if (!controller._godotInitialized) {
				controller._godotInitialized = true;
				controller.init();
			} else {
				controller.updateView();
			}
		};

		// If Godot was already connected and registered its hooks before this module finished importing:
		if (window.GodotCheckersBridge && window.GodotCheckersBridge._onGodotRender && !controller._godotInitialized) {
			console.log('[Godot 3D Shell] Godot was already connected. Initializing CheckersController immediately...');
			controller._godotInitialized = true;
			controller.init();
		}

		window.__checkers = {
			adapter,
			controller
		};

		window.__GODOT_3D_CLIENT__ = {
			ready: true,
			version: "1.0.0",
			initializedAt: new Date().toISOString()
		};

		console.log('[Godot 3D Shell] ES module bridge interface initialized with CheckersController and GodotAdapter.');
	</script>
</body>
</html>
