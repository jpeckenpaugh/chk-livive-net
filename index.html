<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Client-side English Draughts (Checkers) game in pure vanilla JavaScript and CSS Grid.">
  <title>Classic Checkers</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <header class="game-header">
      <h1 class="game-title">Classic Checkers</h1>
      <div class="header-controls">
        <button id="btn-rotate" class="btn btn-icon" title="Rotate Board" aria-label="Rotate Board">
          <svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
          </svg>
          <span class="btn-text">Rotate</span>
        </button>
        <button id="btn-notation" class="btn btn-icon" title="Toggle Square Notation (1-32)" aria-label="Toggle Notation">
          <svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <path d="M8 8h8M8 12h8M8 16h5"/>
          </svg>
          <span class="btn-text">Numbers</span>
        </button>
        <button id="btn-mute" class="btn btn-icon" title="Toggle Sound" aria-label="Toggle Sound">
          <svg id="icon-sound-on" class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
          </svg>
          <svg id="icon-sound-off" class="icon hidden" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <line x1="23" y1="9" x2="17" y2="15"/>
            <line x1="17" y1="9" x2="23" y2="15"/>
          </svg>
          <span class="btn-text" id="sound-label">Sound</span>
        </button>
        <button id="btn-new-game" class="btn btn-primary" title="Start a New Game">
          New Game
        </button>
      </div>
    </header>

    <!-- Scoreboard and Status Area -->
    <section class="game-info-card">
      <div class="player-card player-black" id="player-black-card">
        <div class="player-badge">
          <span class="piece-avatar black-avatar"></span>
          <span class="player-name">Black</span>
        </div>
        <div class="player-stats">
          <span class="stat-item"><strong id="black-pieces-count">12</strong> pieces</span>
          <span class="stat-item kings-count"><strong id="black-kings-count">0</strong> <span class="crown-symbol">♔</span></span>
        </div>
      </div>

      <div class="turn-status-container">
        <div class="turn-badge" id="turn-badge">
          <span class="turn-dot" id="turn-dot"></span>
          <span class="turn-text" id="turn-text">Red's Turn</span>
        </div>
        <div class="turn-message" id="turn-message">Select a piece to move.</div>
      </div>

      <div class="player-card player-red active-turn" id="player-red-card">
        <div class="player-badge">
          <span class="piece-avatar red-avatar"></span>
          <span class="player-name">Red</span>
        </div>
        <div class="player-stats">
          <span class="stat-item"><strong id="red-pieces-count">12</strong> pieces</span>
          <span class="stat-item kings-count"><strong id="red-kings-count">0</strong> <span class="crown-symbol">♔</span></span>
        </div>
      </div>
    </section>

    <!-- Checkers Board Area -->
    <main class="board-wrapper">
      <div id="board" class="board" role="grid" aria-label="Checkers Board"></div>
    </main>

    <!-- Game Over Modal Overlay -->
    <div id="game-over-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-card">
        <div class="modal-trophy">🏆</div>
        <h2 id="modal-title" class="modal-title">Victory!</h2>
        <p id="modal-message" class="modal-message">Red has won the game!</p>
        <div class="modal-actions">
          <button id="btn-modal-restart" class="btn btn-primary btn-large">Play Again</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
